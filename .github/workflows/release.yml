name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry Homebrew publication for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.19.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs['source-sha'] }}
      immutable_release: ${{ steps.release.outputs['immutable-release'] }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - id: release
        name: Validate the stable release identity
        uses: quality-gates/homebrew-tap/.github/actions/validate-source-release@92b635fe61fb926a5b13c7c59f163c3cec3ca756
        with:
          tool: messcript
          tag: ${{ env.TAG }}
          github-token: ${{ github.token }}

      - name: Require the package version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: test "$(jq -r .version package.json)" = "$VERSION"


  test:
    name: Test release source
    needs: validate
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run the complete test suite
        run: npm test
      - name: Check TypeScript
        run: npm run check
      - name: Build and self-analyse
        run: node dist/cli.js src text typescript --ignore-tests

  build:
    name: Build darwin/${{ matrix.arch }}
    needs: [validate, test]
    if: needs.validate.outputs.immutable_release != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            machine: x86_64
          - arch: arm64
            runner: macos-15
            machine: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build the standalone executable
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          npm run build
          mkdir -p dist/native
          npx --no-install ncc build scripts/native-entry.cjs -o dist/native/bundle
          bundle="$PWD/dist/native/bundle/index.cjs"
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({
            main: process.argv[2],
            output: process.argv[3],
            disableExperimentalSEAWarning: true,
            useSnapshot: false,
            useCodeCache: false,
          }))' "$PWD/dist/native/sea-config.json" "$bundle" "$PWD/dist/native/sea.blob"
          node --experimental-sea-config dist/native/sea-config.json
          cp "$(command -v node)" dist/native/messcript
          codesign --remove-signature dist/native/messcript
          npx --no-install postject \
            dist/native/messcript NODE_SEA_BLOB dist/native/sea.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA
          codesign --sign - --force dist/native/messcript
          codesign --verify --strict dist/native/messcript
          test "$(dist/native/messcript --version)" = "messcript $VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: messcript-native-${{ matrix.arch }}
          path: dist/native/messcript
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release assets
    needs: [validate, build]
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: messcript-native-*
          path: native
      - name: Create reproducible archives and checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "${{ needs.validate.outputs.source_sha }}")"
          mkdir -p dist stage
          for arch in amd64 arm64; do
            rm -rf stage/*
            cp LICENSE stage/LICENSE
            cp "native/messcript-native-$arch/messcript" stage/messcript
            chmod 0755 stage/messcript
            archive="messcript_${VERSION}_darwin_${arch}.tar.gz"
            tar --sort=name \
              --mtime="@$source_date_epoch" \
              --owner=0 --group=0 --numeric-owner \
              -C stage -cf - LICENSE messcript | gzip -n > "dist/$archive"
          done
          (cd dist && sha256sum messcript_*.tar.gz | LC_ALL=C sort > checksums.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke test ${{ matrix.runner }}
    needs: [validate, package]
    if: needs.validate.outputs.immutable_release != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            machine: x86_64
          - arch: arm64
            runner: macos-15
            machine: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: dist

      - name: Run the exact packaged executable
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          (cd dist && shasum -a 256 -c checksums.txt)
          archive="dist/messcript_${VERSION}_darwin_${{ matrix.arch }}.tar.gz"
          test "$(tar -tzf "$archive" | LC_ALL=C sort)" = $'LICENSE\nmesscript'
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          codesign --verify --strict unpacked/messcript
          test "$(unpacked/messcript --version)" = "messcript $VERSION"
          cat > "$RUNNER_TEMP/smoke.ts" <<'EOF'
          export function meaning(): number { return 42; }
          EOF
          unpacked/messcript "$RUNNER_TEMP/smoke.ts" json typescript \
            --ignore-violations-on-exit > "$RUNNER_TEMP/report.json"
          test "$(jq -r .tool.version "$RUNNER_TEMP/report.json")" = "$VERSION"
          test "$(jq -r '.errors | length' "$RUNNER_TEMP/report.json")" = 0

  publish:
    name: Publish the immutable release and Homebrew formula
    needs: [validate, smoke]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.smoke.result == 'success' || needs.validate.outputs.immutable_release == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 135
    environment: homebrew
    permissions:
      contents: write
    steps:
      - uses: quality-gates/homebrew-tap/.github/actions/publish-source-release@92b635fe61fb926a5b13c7c59f163c3cec3ca756
        with:
          tool: messcript
          tag: ${{ env.TAG }}
          version: ${{ needs.validate.outputs.version }}
          source-sha: ${{ needs.validate.outputs.source_sha }}
          immutable-release: ${{ needs.validate.outputs.immutable_release }}
          github-token: ${{ github.token }}
          tap-app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          tap-app-private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
