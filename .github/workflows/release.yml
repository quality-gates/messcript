name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to retry Homebrew publication for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.19.0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      source_sha: ${{ steps.tag.outputs.source_sha }}
      immutable_release: ${{ steps.tag.outputs.immutable_release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - id: tag
        name: Require a stable semantic-version tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH; got: $TAG" >&2
            exit 1
          fi
          version="${TAG#v}"
          test "$(jq -r .version package.json)" = "$version"
          source_sha="$(git rev-list -n 1 "$TAG")"
          if [[ -z "$source_sha" ]]; then
            echo "Tag does not resolve to a commit: $TAG" >&2
            exit 1
          fi
          remote_sha="$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)"
          if [[ -z "$remote_sha" ]]; then
            remote_sha="$(git ls-remote origin "refs/tags/$TAG" | cut -f1)"
          fi
          if [[ "$remote_sha" != "$source_sha" ]]; then
            echo "Remote tag resolves to $remote_sha, expected $source_sha." >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "push" ]]; then
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_SHA" = "$source_sha"
          fi
          immutable_release=false
          if release="$(gh api "repos/$GH_REPO/releases/tags/$TAG" 2>/dev/null)"; then
            if [[ "$(jq -r .draft <<<"$release")" == false && \
                  "$(jq -r .prerelease <<<"$release")" == false && \
                  "$(jq -r .immutable <<<"$release")" == true ]]; then
              immutable_release=true
            fi
          fi
          {
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "immutable_release=$immutable_release"
          } >> "$GITHUB_OUTPUT"

  test:
    name: Test release source
    needs: validate
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run the complete test suite
        run: npm test
      - name: Check TypeScript
        run: npm run check
      - name: Build and self-analyse
        run: node dist/cli.js src text typescript --ignore-tests

  build:
    name: Build darwin/${{ matrix.arch }}
    needs: [validate, test]
    if: needs.validate.outputs.immutable_release != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            machine: x86_64
          - arch: arm64
            runner: macos-15
            machine: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build the standalone executable
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          npm run build
          mkdir -p dist/native
          npx --no-install ncc build scripts/native-entry.cjs -o dist/native/bundle
          bundle="$PWD/dist/native/bundle/index.cjs"
          node -e 'require("node:fs").writeFileSync(process.argv[1], JSON.stringify({
            main: process.argv[2],
            output: process.argv[3],
            disableExperimentalSEAWarning: true,
            useSnapshot: false,
            useCodeCache: false,
          }))' "$PWD/dist/native/sea-config.json" "$bundle" "$PWD/dist/native/sea.blob"
          node --experimental-sea-config dist/native/sea-config.json
          cp "$(command -v node)" dist/native/messcript
          codesign --remove-signature dist/native/messcript
          npx --no-install postject \
            dist/native/messcript NODE_SEA_BLOB dist/native/sea.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 \
            --macho-segment-name NODE_SEA
          codesign --sign - --force dist/native/messcript
          codesign --verify --strict dist/native/messcript
          test "$(dist/native/messcript --version)" = "messcript $VERSION"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: messcript-native-${{ matrix.arch }}
          path: dist/native/messcript
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package release assets
    needs: [validate, build]
    if: needs.validate.outputs.immutable_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: messcript-native-*
          path: native
      - name: Create reproducible archives and checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "${{ needs.validate.outputs.source_sha }}")"
          mkdir -p dist stage
          for arch in amd64 arm64; do
            rm -rf stage/*
            cp LICENSE stage/LICENSE
            cp "native/messcript-native-$arch/messcript" stage/messcript
            chmod 0755 stage/messcript
            archive="messcript_${VERSION}_darwin_${arch}.tar.gz"
            tar --sort=name \
              --mtime="@$source_date_epoch" \
              --owner=0 --group=0 --numeric-owner \
              -C stage -cf - LICENSE messcript | gzip -n > "dist/$archive"
          done
          (cd dist && sha256sum messcript_*.tar.gz | LC_ALL=C sort > checksums.txt)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke test ${{ matrix.runner }}
    needs: [validate, package]
    if: needs.validate.outputs.immutable_release != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
            machine: x86_64
          - arch: arm64
            runner: macos-15
            machine: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-assets
          path: dist

      - name: Run the exact packaged executable
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
          (cd dist && shasum -a 256 -c checksums.txt)
          archive="dist/messcript_${VERSION}_darwin_${{ matrix.arch }}.tar.gz"
          test "$(tar -tzf "$archive" | LC_ALL=C sort)" = $'LICENSE\nmesscript'
          mkdir unpacked
          tar -xzf "$archive" -C unpacked
          codesign --verify --strict unpacked/messcript
          test "$(unpacked/messcript --version)" = "messcript $VERSION"
          cat > "$RUNNER_TEMP/smoke.ts" <<'EOF'
          export function meaning(): number { return 42; }
          EOF
          unpacked/messcript "$RUNNER_TEMP/smoke.ts" json typescript \
            --ignore-violations-on-exit > "$RUNNER_TEMP/report.json"
          test "$(jq -r .tool.version "$RUNNER_TEMP/report.json")" = "$VERSION"
          test "$(jq -r '.errors | length' "$RUNNER_TEMP/report.json")" = 0

  release:
    name: Publish immutable GitHub release
    needs: [validate, smoke]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.smoke.result == 'success' || needs.validate.outputs.immutable_release == 'true')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      arm64_sha: ${{ steps.release.outputs.arm64_sha }}
      amd64_sha: ${{ steps.release.outputs.amd64_sha }}
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: needs.validate.outputs.immutable_release != 'true'
        with:
          name: release-assets
          path: dist

      - id: release
        name: Create or verify release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_source_sha="${{ needs.validate.outputs.source_sha }}"
          verify_remote_tag() {
            remote_sha="$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$TAG^{}" | cut -f1)"
            if [[ -z "$remote_sha" ]]; then
              remote_sha="$(git ls-remote "https://github.com/$GH_REPO.git" "refs/tags/$TAG" | cut -f1)"
            fi
            if [[ "$remote_sha" != "$expected_source_sha" ]]; then
              echo "Remote tag moved to $remote_sha; expected $expected_source_sha." >&2
              exit 1
            fi
          }
          verify_remote_tag

          if release="$(gh release view "$TAG" --json databaseId,isDraft,isPrerelease 2>/dev/null)"; then
            release_id="$(jq -r .databaseId <<<"$release")"
            is_draft="$(jq -r .isDraft <<<"$release")"
            if [[ "$(jq -r .isPrerelease <<<"$release")" == true ]]; then
              echo "The release for a stable tag must not be a prerelease." >&2
              exit 1
            fi
            if [[ "$is_draft" != true ]]; then
              echo "A published release already exists; verifying immutable assets."
              release_api="repos/$GH_REPO/releases/$release_id"
              test "$(gh api "$release_api" --jq .tag_name)" = "$TAG"
              test "$(gh api "$release_api" --jq .prerelease)" = false
              if [[ "$(gh api "$release_api" --jq .immutable)" != true ]]; then
                echo "The existing published release is not immutable." >&2
                exit 1
              fi
              rm -rf dist
              mkdir dist
              gh release download "$TAG" --dir dist
            fi
          else
            gh release create "$TAG" \
              --draft --verify-tag --title "messcript ${TAG#v}" --generate-notes
            release="$(gh release view "$TAG" --json databaseId,isDraft)"
            release_id="$(jq -r .databaseId <<<"$release")"
            is_draft="$(jq -r .isDraft <<<"$release")"
          fi
          release_api="repos/$GH_REPO/releases/$release_id"

          if [[ "$is_draft" == true ]]; then
            mkdir -p existing
            for asset in dist/*; do
              name="$(basename "$asset")"
              if gh api "$release_api" --jq '.assets[].name' | grep -Fxq "$name"; then
                gh release download "$TAG" --pattern "$name" --dir existing
                if ! cmp -s "$asset" "existing/$name"; then
                  echo "Draft asset differs from the verified build: $name" >&2
                  exit 1
                fi
              else
                gh release upload "$TAG" "$asset"
              fi
            done
          fi

          expected_assets="$(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)"
          actual_assets="$(gh api "$release_api" --jq '[.assets[].name] | sort | .[]')"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Release assets do not match the verified build." >&2
            diff -u <(printf '%s\n' "$expected_assets") <(printf '%s\n' "$actual_assets") || true
            exit 1
          fi
          version="${TAG#v}"
          required_assets="$(printf '%s\n' \
            "messcript_${version}_darwin_amd64.tar.gz" \
            "messcript_${version}_darwin_arm64.tar.gz" \
            checksums.txt | LC_ALL=C sort)"
          test "$expected_assets" = "$required_assets"
          (cd dist && sha256sum -c checksums.txt)

          if [[ "$is_draft" == true ]]; then
            verify_remote_tag
            gh release edit "$TAG" --draft=false --latest
          fi

          immutable=false
          for attempt in {1..10}; do
            immutable="$(gh api "$release_api" --jq .immutable 2>/dev/null || true)"
            [[ "$immutable" == true ]] && break
            sleep $((attempt * 6))
          done
          if [[ "$immutable" != true ]]; then
            echo "Release was published but is not immutable; Homebrew dispatch is blocked." >&2
            exit 1
          fi
          test "$(gh api "$release_api" --jq .prerelease)" = false
          gh release verify "$TAG"
          for asset in dist/*; do
            gh release verify-asset "$TAG" "$asset"
          done
          arm64_sha="$(awk -v asset="messcript_${version}_darwin_arm64.tar.gz" '$2 == asset { print $1 }' dist/checksums.txt)"
          amd64_sha="$(awk -v asset="messcript_${version}_darwin_amd64.tar.gz" '$2 == asset { print $1 }' dist/checksums.txt)"
          [[ "$arm64_sha" =~ ^[0-9a-f]{64}$ ]]
          [[ "$amd64_sha" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "release_id=$release_id"
            echo "arm64_sha=$arm64_sha"
            echo "amd64_sha=$amd64_sha"
          } >> "$GITHUB_OUTPUT"

  homebrew:
    name: Update Homebrew tap
    needs: [validate, release]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.release.result == 'success'
    runs-on: ubuntu-latest
    environment: homebrew
    steps:
      - id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: quality-gates
          repositories: homebrew-tap
          permission-actions: write

      - id: dispatch
        name: Dispatch tap-owned publication workflow
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          ARM64_SHA: ${{ needs.release.outputs.arm64_sha }}
          AMD64_SHA: ${{ needs.release.outputs.amd64_sha }}
        run: |
          set -euo pipefail
          response="$(gh api --method POST \
            repos/quality-gates/homebrew-tap/actions/workflows/publish-formula.yml/dispatches \
            -F return_run_details=true \
            -f ref=main \
            -f 'inputs[tool]=messcript' \
            -f "inputs[tag]=$TAG" \
            -f "inputs[version]=$VERSION" \
            -f "inputs[release_id]=$RELEASE_ID" \
            -f "inputs[source_sha]=$SOURCE_SHA" \
            -f "inputs[arm64_asset]=messcript_${VERSION}_darwin_arm64.tar.gz" \
            -f "inputs[amd64_asset]=messcript_${VERSION}_darwin_amd64.tar.gz" \
            -f "inputs[arm64_sha]=$ARM64_SHA" \
            -f "inputs[amd64_sha]=$AMD64_SHA")"
          run_id="$(jq -r .workflow_run_id <<<"$response")"
          run_url="$(jq -r .html_url <<<"$response")"
          test "$run_id" != null
          test "$run_url" != null
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "Tap publication: $run_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for tap publication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.dispatch.outputs.run_id }}
        run: gh run watch "$RUN_ID" --repo quality-gates/homebrew-tap --exit-status
